<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completar Perfil - FatecWeek</title>
  <link rel="stylesheet" href="style-completar.css">
</head>

<body>
  <div class="form-container">
    <h1>👤 Completar Perfil</h1>
    <p>Olá! Antes de continuar, precisamos de algumas informações.</p>

    <form id="formPerfil">
      <input type="hidden" id="email" name="email">
      <input type="hidden" id="nome" name="nome">

      <input type="hidden" name="tipo" value="aluno">

      <div id="camposAluno" style="display:none;">
        <div class="form-group">
          <label for="ra">RA</label>
          <input type="text" id="ra" name="ra" placeholder="Ex: 2321101234">
        </div>

        <div class="form-group">
          <label for="semestre">Semestre</label>
          <select id="semestre" name="semestre">
            <option value="1º Semestre">1º Semestre</option>
            <option value="2º Semestre">2º Semestre</option>
            <option value="3º Semestre">3º Semestre</option>
            <option value="4º Semestre">4º Semestre</option>
            <option value="5º Semestre">5º Semestre</option>
            <option value="6º Semestre">6º Semestre</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="fatec">Fatec de Origem</label>
        <select id="fatec" name="fatec">
          <option value="Fatec Osasco">Fatec Osasco</option>
          <option value="Fatec São Paulo">Fatec São Paulo</option>
          <option value="Fatec Barueri">Fatec Barueri</option>
          <option value="Fatec Carapicuíba">Fatec Carapicuíba</option>
          <option value="Fatec Cotia">Fatec Cotia</option>
        </select>
      </div>

      <div class="form-group">
        <label for="curso">Curso</label>
        <select id="curso" name="curso">
          <option value="">Selecione seu curso</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
          <option value="dsm">Desenvolvimento de Software Multiplataforma</option>
          <option value="si">Sistemas para Internet</option>
          <option value="bd">Banco de Dados</option>
          <option value="jogos">Jogos Digitais</option>
          <option value="redes">Redes de Computadores</option>
          <option value="si-gestao">Sistemas de Informação - Gestão</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <button type="submit" class="btn">Salvar Perfil</button>
    </form>
  </div>

  <script src="js/completar-perfil.js" defer></script>
</body>

</html>
